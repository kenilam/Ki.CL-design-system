name: CI

# On push, because pull requests opened by a workflow don't start
# pull_request runs.
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # setup-node's yarn cache calls yarn, which has to be the packageManager
      # version by then. The runner ships Yarn 1.
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable

      - run: yarn lint

      - run: yarn lint:stylelint

      - run: yarn typecheck

      - run: yarn build

      - run: yarn check:search
